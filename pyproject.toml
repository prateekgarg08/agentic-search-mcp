[project]
name = "agentic-search-mcp"
version = "0.1.0"
description = "A small MCP server exposing read, glob, and grep tools over a configurable root directory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
examples = ["openai-agents>=0.1.0"]

[project.scripts]
agentic-search-mcp = "agentic_search_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_search_mcp"]
